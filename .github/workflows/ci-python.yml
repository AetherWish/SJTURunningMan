name: Python 检查

# 只在电脑版（Python）相关文件变动时运行。
# 文档、安卓、iOS、鸿蒙的改动不会触发这个工作流 —— 见同目录 ci-android.yml。
#
# 背景：release.yml 只在推 v* tag 时运行，PR 上原本没有任何检查。

on:
  pull_request:
    paths:
      - 'qtui.py'
      - 'src/**'
      - 'utils/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'main.spec'
      - 'build_windows.ps1'
      - 'route_planner.html'
      - '.github/workflows/ci-python.yml'
  push:
    branches: [master]
    paths:
      - 'qtui.py'
      - 'src/**'
      - 'utils/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'main.spec'
      - 'build_windows.ps1'
      - 'route_planner.html'
      - '.github/workflows/ci-python.yml'

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14.6'

jobs:
  python:
    name: Python 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q qtui.py src utils

      - name: 导入冒烟（不依赖图形界面）
        run: |
          python - <<'PY'
          # 这些模块不依赖 Qt，覆盖了上传、数据生成、路线预览与登录等核心逻辑
          import src.config
          import src.data_generator
          import src.api_client
          import src.route_preview
          import src.login
          import src.main
          import utils.auxiliary_util

          print("core imports OK, version =", src.config.global_version)
          PY

      - name: 安装 Qt 运行库
        # runner 默认没有这些库，PySide6 加载 QtCore 时会报
        # ImportError: libEGL.so.1: cannot open shared object file
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0

      - name: 界面模块导入（offscreen）
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # qtui 有 __main__ 守卫，导入不会真正开窗；
          # 这一步能抓到 PySide6 API 变动与 assets/resources_rc 缺失
          python -c "import qtui; print('qtui import OK')"
